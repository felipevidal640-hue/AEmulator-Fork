
name: EmuDroid APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/modernization

permissions:
  contents: read

jobs:
  build:
    name: Build EmuDroid APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Remove Windows-only Gradle Java paths
      - name: Fix Windows Java configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("gradle.properties"),
              Path.home() / ".gradle" / "gradle.properties",
          ]

          for path in files:
              if not path.is_file():
                  continue

              original = path.read_text(
                  encoding="utf-8"
              ).splitlines()

              cleaned = [
                  line for line in original
                  if not line.strip().startswith(
                      "org.gradle.java.home="
                  )
              ]

              if cleaned != original:
                  path.write_text(
                      "\n".join(cleaned) + "\n",
                      encoding="utf-8",
                  )
                  print(f"Fixed: {path}")
              else:
                  print(f"No Java override: {path}")
          PY

      # 5. Install Android SDK packages
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      # 6. Check Java and project
      - name: Check build environment
        shell: bash
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          test -f gradlew || {
            echo "::error::gradlew not found in repository root"
            exit 1
          }
          chmod +x gradlew

      # 7. Build debug APK
      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 8. Upload APK
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EmuDroid-debug-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      # 9. Upload diagnostic files if build fails
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EmuDroid-build-diagnostics
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
